<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Music</title>
<style>
  :root { --bg: #030303; --panel: #141414; --line: #262626; --text: #fff; --muted: #aaa; --red: #ff0033; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.35 Roboto, system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; user-select: none; }

  header { display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 4px; flex: none; }
  h1 { font-size: 20px; margin: 0 0 0 4px; flex: 1; white-space: nowrap; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .icon { width: 44px; height: 44px; display: grid; place-content: center; border-radius: 50%; color: #eee; flex: none; }
  .icon:active { background: #222; }
  .icon.on { color: var(--red); }
  svg { width: 24px; height: 24px; fill: currentColor; }
  .addbtn { background: #fff; color: #000; border-radius: 18px; padding: 8px 14px; font-weight: 600; display: flex; align-items: center; gap: 4px; flex: none; }
  .addbtn svg { width: 18px; height: 18px; }
  .search { padding: 0 12px 8px; flex: none; }
  .search input { width: 100%; padding: 10px 14px; border-radius: 20px; border: 1px solid var(--line); background: #1a1a1a;
    color: var(--text); font: inherit; outline: none; }

  main { flex: 1; overflow-y: auto; padding: 0 4px 8px; }
  .empty { height: 100%; display: grid; place-content: center; text-align: center; color: var(--muted); padding: 24px; gap: 8px; }
  .empty b { color: var(--text); font-size: 18px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 8px; }
  .row:active { background: #1a1a1a; }
  .row.playing .t { color: var(--red); }
  .art { width: 48px; height: 48px; border-radius: 4px; background: #2a2a2a center/cover no-repeat; flex: none; display: grid; place-content: center; color: #666; }
  .meta { flex: 1; min-width: 0; }
  .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { color: var(--muted); }

  footer { flex: none; background: var(--panel); border-top: 1px solid var(--line); padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); }
  .seek { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; padding: 0 4px; }
  .seek input { flex: 1; accent-color: var(--red); }
  .bar { display: flex; align-items: center; gap: 8px; }
  .bar .art { width: 44px; height: 44px; }
  .play { width: 48px; height: 48px; background: #fff; color: #000; }
  .play:active { background: #ddd; }
  .toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); background: #333; padding: 10px 16px;
    border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; z-index: 5; }
  .sheet.open { display: flex; }
  .sheet div { width: 100%; background: #1f1f1f; border-radius: 12px 12px 0 0; padding: 8px 0 calc(12px + env(safe-area-inset-bottom)); }
  .sheet p { margin: 8px 20px 12px; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet button { display: block; width: 100%; text-align: left; padding: 14px 20px; }
  .sheet button:active { background: #2a2a2a; }
</style>
</head>
<body>
<header>
  <button class="icon" id="back" aria-label="Back to YouTube Music"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2Z"/></svg></button>
  <h1>My Music</h1>
  <button class="addbtn" id="add"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>Add</button>
</header>
<div class="search"><input type="search" id="search" placeholder="Search your music" spellcheck="false"></div>
<main id="list"></main>
<footer>
  <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <div class="bar">
    <div class="art" id="nowArt"></div>
    <div class="meta"><div class="t" id="nowTitle">Nothing playing</div><div class="a" id="nowArtist"></div></div>
    <button class="icon" id="shuffle" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4ZM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5Zm.3 9.4-1.4 1.4 3.1 3.1-2 2.1H20v-5.5l-2 2-3.2-3.1Z"/></svg></button>
    <button class="icon" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6Zm3.5 6 8.5 6V6l-8.5 6Z"/></svg></button>
    <button class="icon play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7L8 5Z"/></svg></button>
    <button class="icon" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2V6ZM6 18l8.5-6L6 6v12Z"/></svg></button>
    <button class="icon" id="repeat" aria-label="Repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7Zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4Z"/></svg></button>
  </div>
</footer>
<div class="sheet" id="sheet"><div><p id="sheetTitle"></p><button id="sheetRemove">Remove from My Music</button><button id="sheetCancel">Cancel</button></div></div>
<div class="toast" id="toast"></div>
<audio id="audio" preload="metadata"></audio>

<script>
  const $ = (id) => document.getElementById(id);
  const native = window.TBLibrary;
  const audio = $('audio');
  let tracks = [], queue = [], current = null, shuffle = false, repeat = 'off', sheetTrack = null;
  const PLAY = '<path d="M8 5v14l11-7L8 5Z"/>';
  const PAUSE = '<path d="M6 5h4v14H6V5Zm8 0h4v14h-4V5Z"/>';
  const NOTE = '<svg viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3h-6Z"/></svg>';
  const MORE = '<svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg>';

  const fmt = (s) => { if (!isFinite(s) || s < 0) s = 0; return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2500); }
  function filtered() {
    const q = $('search').value.trim().toLowerCase();
    return q ? tracks.filter((t) => (t.title + ' ' + t.artist + ' ' + t.album).toLowerCase().includes(q)) : tracks;
  }
  function artEl(t, cls) {
    const d = document.createElement('div');
    d.className = cls || 'art';
    if (t && t.art) d.style.backgroundImage = 'url("' + t.art + '")'; else d.innerHTML = t ? NOTE : '';
    return d;
  }

  function render() {
    const list = $('list');
    list.replaceChildren();
    if (!tracks.length) {
      list.innerHTML = '<div class="empty"><b>Your music, ad-free</b><span>Tap <b>Add</b> to pick MP3, M4A, FLAC, WAV or OGG files from your phone.</span></div>';
      return;
    }
    const items = filtered();
    items.forEach((t) => {
      const row = document.createElement('div');
      row.className = 'row' + (current && current.id === t.id ? ' playing' : '');
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.append(Object.assign(document.createElement('div'), { className: 't', textContent: t.title }),
        Object.assign(document.createElement('div'), { className: 'a', textContent: t.artist + ' · ' + fmt(t.duration) }));
      const more = document.createElement('button');
      more.className = 'icon more';
      more.innerHTML = MORE;
      more.addEventListener('click', (e) => { e.stopPropagation(); openSheet(t); });
      row.append(artEl(t), meta, more);
      row.addEventListener('click', () => { if (current && current.id === t.id) toggle(); else playFrom(t.id, items); });
      list.appendChild(row);
    });
  }

  function refresh() {
    try { tracks = JSON.parse(native.list()); } catch (e) { tracks = []; }
    render();
  }
  window.__libRefresh = (res) => {
    if (res && res.added) toast('Added ' + res.added + (res.added === 1 ? ' song' : ' songs'));
    else if (res && res.skipped) toast('Nothing new to add');
    refresh();
  };

  function openSheet(t) { sheetTrack = t; $('sheetTitle').textContent = t.title + ' · ' + t.artist; $('sheet').classList.add('open'); }
  $('sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') $('sheet').classList.remove('open'); });
  $('sheetCancel').addEventListener('click', () => $('sheet').classList.remove('open'));
  $('sheetRemove').addEventListener('click', () => {
    const t = sheetTrack;
    $('sheet').classList.remove('open');
    if (!t) return;
    if (current && current.id === t.id) { audio.pause(); audio.removeAttribute('src'); current = null; updateNow(); }
    native.remove(t.id);
    toast('Removed. The original file on your phone is untouched.');
    refresh();
  });

  function buildQueue(items, firstId) {
    const ids = items.map((t) => t.id);
    if (!shuffle) return ids;
    const rest = ids.filter((id) => id !== firstId);
    for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
    return firstId ? [firstId, ...rest] : rest;
  }
  function playFrom(id, items) { queue = buildQueue(items || filtered(), id); load(id, true); }
  function load(id, autoplay) {
    const t = tracks.find((x) => x.id === id);
    if (!t) return;
    current = t;
    audio.src = t.src;
    if (autoplay) audio.play().catch(() => {});
    updateNow();
    render();
  }
  function step(dir) {
    if (!current) { if (tracks.length) playFrom(filtered()[0].id); return; }
    if (dir < 0 && audio.currentTime > 3) { audio.currentTime = 0; return; }
    let i = queue.indexOf(current.id) + dir;
    if (i >= queue.length) { if (repeat === 'all') i = 0; else { audio.pause(); audio.currentTime = 0; return; } }
    if (i < 0) i = repeat === 'all' ? queue.length - 1 : 0;
    load(queue[i], true);
  }
  function toggle() {
    if (!current) { if (tracks.length) playFrom(filtered()[0].id); return; }
    if (audio.paused) audio.play().catch(() => {}); else audio.pause();
  }
  function updateNow() {
    $('nowTitle').textContent = current ? current.title : 'Nothing playing';
    $('nowArtist').textContent = current ? current.artist : '';
    $('nowArt').replaceWith(Object.assign(artEl(current), { id: 'nowArt' }));
    report(true);
  }

  let lastReport = 0;
  function report(force) {
    if (!force && Date.now() - lastReport < 1000) return;
    lastReport = Date.now();
    native.onState(current ? JSON.stringify({
      title: current.title, artist: current.artist, album: current.album, art: current.art || '',
      duration: audio.duration || current.duration || 0, currentTime: audio.currentTime || 0, paused: audio.paused,
    }) : 'null');
  }

  audio.addEventListener('play', () => { $('playIcon').innerHTML = PAUSE; report(true); });
  audio.addEventListener('pause', () => { $('playIcon').innerHTML = PLAY; report(true); });
  audio.addEventListener('seeked', () => report(true));
  let seeking = false;
  audio.addEventListener('timeupdate', () => {
    $('cur').textContent = fmt(audio.currentTime);
    $('dur').textContent = fmt(audio.duration);
    if (!seeking && audio.duration) $('seek').value = Math.round(audio.currentTime / audio.duration * 1000);
    report();
  });
  audio.addEventListener('ended', () => { if (repeat === 'one') { audio.currentTime = 0; audio.play(); } else step(1); });
  audio.addEventListener('error', () => { if (current) toast('Couldn\'t play this file'); });
  $('seek').addEventListener('input', () => { seeking = true; $('cur').textContent = fmt((audio.duration || 0) * $('seek').value / 1000); });
  $('seek').addEventListener('change', () => { if (audio.duration) audio.currentTime = audio.duration * $('seek').value / 1000; seeking = false; });

  $('play').addEventListener('click', toggle);
  $('next').addEventListener('click', () => step(1));
  $('prev').addEventListener('click', () => step(-1));
  $('shuffle').addEventListener('click', () => { shuffle = !shuffle; $('shuffle').classList.toggle('on', shuffle); if (current) queue = buildQueue(filtered(), current.id); });
  $('repeat').addEventListener('click', () => {
    repeat = repeat === 'off' ? 'all' : repeat === 'all' ? 'one' : 'off';
    $('repeat').classList.toggle('on', repeat !== 'off');
    toast(repeat === 'one' ? 'Repeat this song' : repeat === 'all' ? 'Repeat all' : 'Repeat off');
  });
  $('search').addEventListener('input', render);
  $('add').addEventListener('click', () => native.add());
  $('back').addEventListener('click', () => native.back());

  // Commands from the app (notification, lock screen, YouTube Music starting)
  window.__libControl = (action, arg) => {
    if (action === 'pause') audio.pause();
    else if (action === 'play') { if (current) audio.play().catch(() => {}); }
    else if (action === 'toggle') toggle();
    else if (action === 'next') step(1);
    else if (action === 'previous') step(-1);
    else if (action === 'seek' && audio.duration) audio.currentTime = arg;
  };

  refresh();
</script>
</body>
</html>
